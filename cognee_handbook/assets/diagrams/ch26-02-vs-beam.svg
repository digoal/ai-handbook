<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="max-width: 700px; background-color: transparent;" viewBox="0 0 700 500" role="graphics-document document" aria-roledescription="xychart"><style>#my-svg{font-family:PingFang SC,Microsoft YaHei,system-ui;font-size:14px;fill:#1F2937;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#552222;}#my-svg .error-text{fill:#552222;stroke:#552222;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#6B7280;stroke:#6B7280;}#my-svg .marker.cross{stroke:#6B7280;}#my-svg svg{font-family:PingFang SC,Microsoft YaHei,system-ui;font-size:14px;}#my-svg p{margin:0;}#my-svg .node .neo-node{stroke:#999;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#999;filter:none;}#my-svg [data-look="neo"].node circle{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g class="main"><rect width="700" height="500" class="background" fill="#FAFAFA"/><g class="chart-title"><text x="0" y="0" fill="#FFFFFF" font-size="20" dominant-baseline="middle" text-anchor="middle" transform="translate(350, 24) rotate(0)">BEAM: 上下文长度 vs BEAM 分数</text></g><g class="plot"><g class="line-plot-0"><path d="M85.539,134.23L384.75,159.64L683.961,177.79" fill="none" stroke="#EEE" stroke-width="2"/></g></g><g class="bottom-axis"><g class="axis-line"><path d="M 69.50000190734863,431.99999809265137 L 700,431.99999809265137" fill="none" stroke="#FFFFFF" stroke-width="2"/></g><g class="label"><text x="0" y="0" fill="#FFFFFF" font-size="14" dominant-baseline="text-before-edge" text-anchor="middle" transform="translate(85.53906440734863, 442.99999809265137) rotate(0)">100K</text><text x="0" y="0" fill="#FFFFFF" font-size="14" dominant-baseline="text-before-edge" text-anchor="middle" transform="translate(384.7500009536743, 442.99999809265137) rotate(0)">1M</text><text x="0" y="0" fill="#FFFFFF" font-size="14" dominant-baseline="text-before-edge" text-anchor="middle" transform="translate(683.9609375, 442.99999809265137) rotate(0)">10M</text></g><g class="ticks"><path d="M 85.53906440734863,432.99999809265137 L 85.53906440734863,437.99999809265137" fill="none" stroke="#FFFFFF" stroke-width="2"/><path d="M 384.7500009536743,432.99999809265137 L 384.7500009536743,437.99999809265137" fill="none" stroke="#FFFFFF" stroke-width="2"/><path d="M 683.9609375,432.99999809265137 L 683.9609375,437.99999809265137" fill="none" stroke="#FFFFFF" stroke-width="2"/></g><g class="title"><text x="0" y="0" fill="#FFFFFF