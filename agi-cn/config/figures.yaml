      (3) 黑板模式(共享内存);
      (4) 中心化协调器(Hub);
      (5) 层次化通信(上下级)。
    source_pages: [134, 135]

  - id: "7-3"
    chapter: 7
    title_zh: "多智能体设计模式总览"
