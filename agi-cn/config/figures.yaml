      生产者智能体(Producer)生成输出,
      评审者智能体(Reviewer/Critic)评估质量,
      两者通过消息传递协作,最终输出经过评审的答案。
    source_pages: [95]

  - id: "5-2"
    chapter: 5
    title_zh: "工具使用模式:ReAct 循环"
    diagram_type: cycle
    description: |
