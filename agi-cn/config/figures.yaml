      阶段一:块级提示优化(独立优化每个智能体模块的提示);
      阶段二:工作流拓扑优化(从设计空间采样有效配置);
      阶段三:工作流级提示优化(对最优工作流进行第二轮提示优化)。
      涉及 Aggregate、Reflect、Debate、Summarize、Tool-use 模块。
