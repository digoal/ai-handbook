  - id: "3-1"
    chapter: 3
    title_zh: "并行化模式:多组件并发执行"
    diagram_type: flowchart
    description: |
      展示并行化(Parallelization)模式的工作流程。左侧是输入任务,
      拆分为多个并行分支(LLM 调用、工具调用、子智能体),并行执行后
      通过聚合(Aggregation)节点合并为单一输出。
      与串行执行对比,展示时间节省。
    source_pages: [69, 70]

  - id: "3-2"
    chapter: 3
    title_zh: "并行化模式视觉总览"
    diagram_type: overview
    description: |
      并行化模式的视觉总结图。中心是核心概念"并行执行",
      周围展示适用场景(信息收集、数据处理、多 API 调用)、
      关键优势(速度提升、资源利用)、挑战(结果合并、错误处理)。
    source_pages: [82]

  - id: "5-1"
    chapter: 5
    title_zh: "智能体使用工具的若干示例"
    diagram_type: architecture
    description: |
      展示智能体(Agent)使用工具的多种场景:
      (1) 网络搜索工具获取实时信息;
      (2) 计算器工具执行数学计算;
      (3) 数据库查询工具访问结构化数据;
      (4) 邮件发送工具执行外部操作。
      中心是智能体,通过工具选择器选择合适的工具。
    source_pages: [100, 101]

  - id: "6-4"
    chapter: 6
    title_zh: "规划模式视觉总览"
    diagram_type: overview
    description: |
      规划(Planning)模式的视觉总结图。展示:
      (1) 任务分解:将复杂目标分解为子任务;
      (2) 依赖分析:识别子任务间的依赖关系;
      (3) 执行计划:生成有序的执行序列;
      (4) 监控与重规划:根据执行反馈动态调整。
    source_pages: [129]

  - id: "7-1"
    chapter: 7
    title_zh: "多智能体系统架构"
    diagram_type: architecture
    description: |
      多智能体协作(Multi-Agent Collaboration)系统的典型架构。
      中心是协调器(Orchestrator)/监督器(Supervisor),协调多个
      专业智能体(规划器、执行器、评审器、记忆器)。
      各智能体通过消息总线通信,共享记忆与任务状态。
    source_pages: [132, 133]

  - id: "8-1"
    chapter: 8
    title_zh: "记忆管理模式视觉总览"
    diagram_type: overview
    description: |
      记忆管理(Memory Management)模式的视觉总结图。
      展示三种记忆类型:短期记忆(上下文窗口)、长期记忆(向量数据库)、
      情景记忆(对话历史)。
      包括记忆的写入、读取、检索、遗忘等操作。
    source_pages: [166]

  - id: "10-1"
    chapter: 10
    title_zh: "模型上下文协议(MCP)架构"
    diagram_type: architecture
    description: |
      模型上下文协议(Model Context Protocol, MCP)的架构图。
      左侧是 MCP 客户端(集成在 LLM 应用中),通过 MCP 协议
      与右侧的 MCP 服务器通信。服务器可访问多种数据源(文件、
      数据库、API)。中间展示 JSON-RPC 协议层。
    source_pages: [194]

  - id: "11-2"
    chapter: 11
    title_zh: "目标设定与监控模式视觉总览"
    diagram_type: overview
    description: |
      目标设定与监控(Goal Setting and Monitoring)模式的视觉总结图。
      展示:(1) 目标定义(高层目标分解为子目标);
      (2) 进度监控(实时跟踪执行状态);
      (3) 反馈调整(根据结果动态修正目标);
      (4) 完成判定(检查是否达成目标)。
    source_pages: [206]

  - id: "13-1"
    chapter: 13
    title_zh: "人在回路(HITL)模式"
    diagram_type: cycle
    description: |
      人在回路(Human-in-the-Loop, HITL)模式的循环图。
      智能体执行 → 生成结果 → 提交给人类审核 → 人类反馈 →
      智能体根据反馈调整 → 重新执行。展示人在关键决策点的介入。
    source_pages: [223]

  - id: "17-3"
    chapter: 17
    title_zh: "ReAct 范式:推理-行动循环"
    diagram_type: cycle
    description: |
      ReAct(Reasoning + Acting)范式的循环图。
      思考(Thought) → 行动(Action) → 观察(Observation) →
      回到思考。智能体在循环中持续推理并采取行动,与外部环境交互。
      与外部知识库(KB)、工具(API)交互。
    source_pages: [280, 281]

  - id: "19-4"
    chapter: 19
    title_zh: "评估与监控模式视觉总览"
    diagram_type: overview
    description: |
      评估与监控(Evaluation and Monitoring)模式的视觉总结图。
      展示:(1) 性能指标(准确率、延迟、成本);
      (2) 离线评估(测试集、基准);
      (3) 在线监控(实时追踪、A/B 测试);
      (4) 反馈回路(指标异常时触发告警)。
    source_pages: [329]

  # ===== 13 个翻译稿引用但路径断裂的图(也需重画) =====

