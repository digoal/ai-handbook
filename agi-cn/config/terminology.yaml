# 总体翻译规则
translation_rules:
  - 完整翻译正文段落,不得摘要、删节、跳过
  - 保留所有 Markdown 结构:标题层级、列表编号、引用块、表格、图片引用
  - 代码块完全保留英文(包括代码注释)
  - 首次出现核心术语使用"中文(English)"格式,后续只用中文
  - API 名、类名、函数名、变量名一律保留英文
  - 不得添加原文不存在的内容
  - 公式优先 LaTeX,失败的用占位符
  - 图表用 markdown 引用 + 中文图题/表题
  - 不要输出"以下是翻译"等元话语
  - 否定句、条件句、情态动词(should/must/may/can)必须准确区分