<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <marker id="arrow-7_3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="20" font-weight="bold" fill="#111827">多智能体设计模式总览</text>

  <!-- Central Node: Multi-Agent Collaboration -->
  <rect x="320" y="265" width="160" height="70" rx="8" ry="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="400" y="295" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="16" font-weight="bold" fill="#111827">多智能体协作</text>
  <text x="400" y="318" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="13" fill="#6B7280">核心设计模式</text>

  <!-- Six Pattern Nodes around the center -->

  <!-- Top Left: 角色分工 -->
  <rect x="60" y="100" width="150" height="60" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="135" y="135" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="15" font-weight="bold" fill="#111827">角色分工模式</text>
  <text x="135" y="153" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#6B7280">明确职责分配</text>

  <!-- Top Center: 层级式 -->
  <rect x="325" y="100" width="150" height="60" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="400" y="135" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="15" font-weight="bold" fill="#111827">层级式</text>
  <text x="400" y="153" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#6B7280">上下级指挥</text>

  <!-- Top Right: 监督式 -->
  <rect x="590" y="100" width="150" height="60" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="665" y="135" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="15" font-weight="bold" fill="#111827">监督式</text>
  <text x="665" y="153" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#6B7280">管理者与执行者</text>

  <!-- Bottom Left: 扁平式 -->
  <rect x="60" y="440" width="150" height="60" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="135" y="475" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="15" font-weight="bold" fill="#111827">扁平式</text>
  <text x="135" y="493" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#6B7280">平等协作</text>

  <!-- Bottom Center: 市场式 -->
  <rect x="325" y="440" width="150" height="60" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="400" y="475" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="15" font-weight="bold" fill="#111827">市场式</text>
  <text x="400" y="493" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#6B7280">竞标与交易</text>

  <!-- Bottom Right: 竞争合作 -->
  <rect x="590" y="440" width="150" height="60" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="665" y="475" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="15" font-weight="bold" fill="#111827">竞争合作</text>
  <text x="665" y="493" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#6B7280">博弈与协同</text>

  <!-- Connecting Lines with arrows pointing TO the center -->
  <line x1="210" y1="145" x2="320" y2="280" stroke="#374151" stroke-width="2" marker-end="url(#arrow-7_3)"/>
  <line x1="400" y1="160" x2="400" y2="265" stroke="#374151" stroke-width="2" marker-end="url(#arrow-7_3)"/>
  <line x1="590" y1="145" x2="480" y2="280" stroke="#374151" stroke-width="2" marker-end="url(#arrow-7_3)"/>
  <line x1="210" y1="455" x2="320" y2="325" stroke="#374151" stroke-width="2" marker-end="url(#arrow-7_3)"/>
  <line x1="400" y1="440" x2="400" y2="335" stroke="#374151" stroke-width="2" marker-end="url(#arrow-7_3)"/>
  <line x1="590" y1="455" x2="480" y2="325" stroke="#374151" stroke-width="2" marker-end="url(#arrow-7_3)"/>

  <!-- Bottom Caption -->
  <text x="400" y="565" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="13" fill="#6B7280">不同模式适用于不同应用场景，可根据任务复杂度灵活选用</text>
</svg>