  <!-- (1) 点对点消息传递 -->
  <text x="100" y="65" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="15" fill="#111827">(1) 点对点消息传递</text>
  <rect x="40" y="90" width="80" height="45" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="80" y="118" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="14" fill="#111827">Agent A</text>
