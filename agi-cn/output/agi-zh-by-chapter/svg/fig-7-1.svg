<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <marker id="arrow-7_1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <marker id="arrow-7_2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#B45309"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="20" font-weight="bold" fill="#111827">多智能体系统架构</text>
  <text x="400" y="54" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="13" fill="#6B7280">Multi-Agent Collaboration Architecture</text>

  <!-- Message Bus (central horizontal band) -->
  <rect x="60" y="345" width="680" height="56" rx="8" ry="8" fill="#F3F4F6" stroke="#374151" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="400" y="378" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="15" font-weight="bold" fill="#111827">消息总线 / Message Bus</text>

  <!-- Orchestrator (highlighted center) -->
  <rect x="320" y="160" width="160" height="80" rx="8" ry="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="400" y="192" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="17" font-weight="bold" fill="#111827">协调器</text>
  <text x="400" y="213" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="13" fill="#B45309">Orchestrator</text>
  <text x="400" y="230" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#6B7280">/ Supervisor</text>

  <!-- Planner (top-left) -->
  <rect x="80" y="100" width="140" height="70" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="150" y="128" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="16" font-weight="bold" fill="#111827">规划器</text>
  <text x="150" y="151" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#374151">Planner</text>

  <!-- Executor (top-right) -->
  <rect x="580" y="100" width="140" height="70" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="650" y="128" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="16" font-weight="bold" fill="#111827">执行器</text>
  <text x="650" y="151" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#374151">Executor</text>

  <!-- Reviewer (bottom-left) -->
  <rect x="80" y="460" width="140" height="70" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="150" y="488" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="16" font-weight="bold" fill="#111827">评审器</text>
  <text x="150" y="511" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#374151">Reviewer</text>

  <!-- Memory (bottom-right) -->
  <rect x="580" y="460" width="140" height="70" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="650" y="488" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="16" font-weight="bold" fill="#111827">记忆器</text>
  <text x="650" y="511" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#374151">Memory</text>

  <!-- Tools/External (left-bottom small) -->
  <rect x="20" y="260" width="110" height="50" rx="8" ry="8" fill="#E5E7EB" stroke="#374151" stroke-width="2"/>
  <text x="75" y="283" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="14" font-weight="bold" fill="#111827">工具/外部</text>
  <text x="75" y="300" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="11" fill="#374151">Tools / APIs</text>

  <!-- LLM backbone (right-bottom small) -->
  <rect x="670" y="260" width="110" height="50" rx="8" ry="8" fill="#E5E7EB" stroke="#374151" stroke-width="2"/>
  <text x="725" y="283" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="14" font-weight="bold" fill="#111827">LLM 模型</text>
  <text x="725" y="300" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="11" fill="#374151">Foundation Model</text>

  <!-- Connections from Orchestrator to agents (emphasized) -->
  <line x1="400" y1="240" x2="150" y2="100" stroke="#B45309" stroke-width="2" marker-end="url(#arrow-7_2)"/>
  <line x1="400" y1="240" x2="650" y2="100" stroke="#B45309" stroke-width="2" marker-end="url(#arrow-7_2)"/>
  <line x1="400" y1="240" x2="150" y2="460" stroke="#B45309" stroke-width="2" marker-end="url(#arrow-7_2)"/>
  <line x1="400" y1="240" x2="650" y2="460" stroke="#B45309" stroke-width="2" marker-end="url(#arrow-7_2)"/>

  <!-- Agents connect to Message Bus -->
  <line x1="150" y1="170" x2="180" y2="345" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow-7_1)"/>
  <line x1="650" y1="170" x2="620" y2="345" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow-7_1)"/>
  <line x1="150" y1="460" x2="200" y2="401" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow-7_1)"/>
  <line x1="650" y1="460" x2="600" y2="401" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow-7_1)"/>

  <!-- Orchestrator also connects down to Message Bus -->
  <line x1="400" y1="240" x2="400" y2="345" stroke="#B45309" stroke-width="2" marker-end="url(#arrow-7_2)"/>

  <!-- Shared Memory indicator (dashed feedback loop from Memory to Orchestrator) -->
  <path d="M 650 460 Q 650 280 480 220" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-7_1)"/>
  <text x="690" y="370" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="11" fill="#6B7280" transform="rotate(-90 690 370)">共享记忆</text>

  <!-- Task status flow indicator -->
  <text x="400" y="430" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="11" fill="#6B7280">任务状态 · 消息流转</text>

  <!-- Tools / LLM connections -->
  <line x1="130" y1="285" x2="180" y2="345" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow-7_1)"/>
  <line x1="670" y1="285" x2="620" y2="345" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow-7_1)"/>

  <!-- Legend -->
  <rect x="60" y="548" width="14" height="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="82" y="560" text-anchor="start" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#111827">强调节点 / Orchestrator</text>

  <rect x="230" y="548" width="14" height="14" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="252" y="560" text-anchor="start" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#111827">专业智能体 / Agents</text>

  <line x1="400" y1="555" x2="430" y2="555" stroke="#B45309" stroke-width="2" marker-end="url(#arrow-7_2)"/>
  <text x="438" y="560" text-anchor="start" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#111827">协调调用</text>

  <line x1="520" y1="555" x2="550" y2="555" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow-7_1)"/>
  <text x="558" y="560" text-anchor="start" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#111827">消息通信</text>

  <!-- Caption -->
  <text x="400" y="585" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#6B7280">协调器调度多个专业智能体,各智能体通过消息总线协作,共享记忆与任务状态</text>
</svg>