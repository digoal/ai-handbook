<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <marker id="arrow-16_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="800" height="600" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="20" font-weight="bold" fill="#111827">OpenRouter:多模型路由平台</text>
  <text x="400" y="58" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="13" fill="#6B7280">统一 API 接口,智能路由多模型供应商</text>

  <!-- User App -->
  <rect x="40" y="240" width="140" height="80" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="110" y="275" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="16" font-weight="bold" fill="#111827">用户应用</text>
  <text x="110" y="297" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#6B7280">User Application</text>

  <!-- Unified API -->
  <rect x="240" y="160" width="160" height="70" rx="8" ry="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="320" y="190" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="16" font-weight="bold" fill="#111827">统一 API 接口</text>
  <text x="320" y="212" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#6B7280">Unified API</text>

  <!-- Routing Layer -->
  <rect x="240" y="330" width="160" height="80" rx="8" ry="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="320" y="360" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="16" font-weight="bold" fill="#111827">路由层</text>
  <text x="320" y="382" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#6B7280">Routing Layer</text>

  <!-- Selection Criteria Box -->
  <rect x="450" y="240" width="180" height="160" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="540" y="268" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="15" font-weight="bold" fill="#111827">选择最优模型</text>
  <line x1="470" y1="282" x2="610" y2="282" stroke="#1F2937" stroke-width="1"/>
  <text x="540" y="307" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="13" fill="#111827">• 价格 (Price)</text>
  <text x="540" y="335" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="13" fill="#111827">• 性能 (Performance)</text>
  <text x="540" y="363" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="13" fill="#111827">• 可用性 (Availability)</text>
  <text x="540" y="391" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="13" fill="#111827">• 上下文长度</text>

  <!-- LLM Models -->
  <rect x="670" y="130" width="110" height="70" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="725" y="160" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="15" font-weight="bold" fill="#111827">GPT-4</text>
  <text x="725" y="182" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="11" fill="#6B7280">OpenAI</text>

  <rect x="670" y="220" width="110" height="70" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="725" y="250" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="15" font-weight="bold" fill="#111827">Claude</text>
  <text x="725" y="272" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="11" fill="#6B7280">Anthropic</text>

  <rect x="670" y="310" width="110" height="70" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="725" y="340" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="15" font-weight="bold" fill="#111827">Gemini</text>
  <text x="725" y="362" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="11" fill="#6B7280">Google</text>

  <rect x="670" y="400" width="110" height="70" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="725" y="430" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="15" font-weight="bold" fill="#111827">Llama / 其他</text>
  <text x="725" y="452" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="11" fill="#6B7280">开源模型</text>

  <!-- Arrows -->
  <!-- User App -> Unified API -->
  <line x1="180" y1="265" x2="235" y2="200" stroke="#374151" stroke-width="2" marker-end="url(#arrow-16_1)"/>
  <text x="200" y="220" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="11" fill="#374151">请求</text>

  <!-- Unified API -> Routing Layer -->
  <line x1="320" y1="230" x2="320" y2="328" stroke="#374151" stroke-width="2" marker-end="url(#arrow-16_1)"/>
  <text x="345" y="282" text-anchor="start" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="11" fill="#374151">转发</text>

  <!-- Routing Layer -> Selection -->
  <line x1="400" y1="350" x2="445" y2="320" stroke="#374151" stroke-width="2" marker-end="url(#arrow-16_1)"/>
  <text x="420" y="328" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="11" fill="#374151">评估</text>

  <!-- Selection -> Models -->
  <line x1="630" y1="290" x2="665" y2="170" stroke="#374151" stroke-width="2" marker-end="url(#arrow-16_1)"/>
  <line x1="630" y1="310" x2="665" y2="255" stroke="#374151" stroke-width="2" marker-end="url(#arrow-16_1)"/>
  <line x1="630" y1="335" x2="665" y2="345" stroke="#374151" stroke-width="2" marker-end="url(#arrow-16_1)"/>
  <line x1="630" y1="360" x2="665" y2="435" stroke="#374151" stroke-width="2" marker-end="url(#arrow-16_1)"/>
  <text x="650" y="165" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="11" fill="#374151">调用</text>

  <!-- Footer note -->
  <text x="400" y="565" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#6B7280">通过统一 API,一次接入,自动选择最优 LLM 模型</text>
</svg>