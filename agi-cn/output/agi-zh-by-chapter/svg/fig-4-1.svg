<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <marker id="arrow-4_1" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="600" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="400" y="35" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="20" fill="#111827" font-weight="bold">反思设计模式:自我反思循环</text>
  <text x="400" y="58" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="13" fill="#6B7280">Self-Reflection Loop: Generator → Critic → Feedback → Regenerate</text>

  <!-- Generator 节点 -->
  <rect x="80" y="250" width="180" height="100" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="170" y="290" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="17" fill="#111827" font-weight="bold">生成器</text>
  <text x="170" y="315" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="14" fill="#374151">Generator</text>
  <text x="170" y="335" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="13" fill="#6B7280">生成初始结果</text>

  <!-- Critic 节点(强调) -->
  <rect x="540" y="250" width="180" height="100" rx="8" ry="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="630" y="290" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="17" fill="#111827" font-weight="bold">评审器</text>
  <text x="630" y="315" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="14" fill="#374151">Critic</text>
  <text x="630" y="335" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="13" fill="#6B7280">评估结果质量</text>

  <!-- 上方箭头: Generator → Critic (生成结果) -->
  <line x1="260" y1="270" x2="540" y2="270" stroke="#374151" stroke-width="2" marker-end="url(#arrow-4_1)"/>
  <text x="400" y="260" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="13" fill="#374151">生成结果</text>

  <!-- 下方箭头: Critic → Generator (反馈改进,不达标) -->
  <path d="M 540,330 L 260,330" stroke="#374151" stroke-width="2" marker-end="url(#arrow-4_1)" fill="none"/>
  <text x="400" y="355" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="13" fill="#B45309" font-weight="bold">反馈改进 (不达标时)</text>

  <!-- 判断菱形: 是否达标? -->
  <polygon points="630,430 700,470 630,510 560,470" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
  <text x="630" y="468" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="13" fill="#111827" font-weight="bold">是否达标?</text>
  <text x="630" y="485" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#6B7280">Pass?</text>

  <!-- Critic → 判断菱形 -->
  <line x1="630" y1="350" x2="630" y2="430" stroke="#374151" stroke-width="2" marker-end="url(#arrow-4_1)"/>

  <!-- 判断: 是 (达标) → 输出 -->
  <path d="M 700,470 Q 730,470 730,440 L 730,200 Q 730,170 700,170 L 660,170" stroke="#374151" stroke-width="2" fill="none"/>
  <text x="745" y="320" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="13" fill="#16A34A" font-weight="bold">是 / Pass</text>

  <!-- 最终输出节点 -->
  <rect x="480" y="135" width="180" height="70" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="570" y="165" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="16" fill="#111827" font-weight="bold">最终输出</text>
  <text x="570" y="187" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="13" fill="#374151">Final Output</text>

  <!-- 判断: 否 (不达标) → 反馈到 Generator -->
  <path d="M 560,470 Q 400,470 400,400 Q 400,380 380,380 L 200,380 Q 180,380 180,360" stroke="#374151" stroke-width="2" fill="none"/>
  <text x="320" y="395" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="13" fill="#B45309" font-weight="bold">否 / Retry</text>

  <!-- 迭代循环标识 -->
  <text x="400" y="540" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="13" fill="#374151" font-style="italic">↻ 评估 - 改进 迭代循环 (Evaluation-Improvement Iterative Loop)</text>

  <!-- 底部说明 -->
  <text x="400" y="575" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#6B7280">生成器生成结果 → 评审器评估 → 未达标则反馈改进 → 重新生成,直至通过</text>
</svg>