<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="sans-serif, Microsoft YaHei, 微软雅黑">
  <defs>
    <marker id="arrow-25_2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="20" fill="#111827" font-weight="bold">AgentSpace 与多样化服务集成</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#6B7280">统一接口对接企业各种 SaaS 服务</text>

  <!-- Central AgentSpace node -->
  <rect x="300" y="250" width="200" height="100" rx="8" ry="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="400" y="295" text-anchor="middle" font-size="18" fill="#111827" font-weight="bold">AgentSpace</text>
  <text x="400" y="320" text-anchor="middle" font-size="14" fill="#111827">统一集成平台</text>

  <!-- Service nodes - arranged around center -->
  <!-- Top row: Calendar, Gmail -->
  <rect x="80" y="110" width="140" height="60" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="150" y="146" text-anchor="middle" font-size="16" fill="#111827">Calendar</text>

  <rect x="580" y="110" width="140" height="60" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="650" y="146" text-anchor="middle" font-size="16" fill="#111827">Gmail</text>

  <!-- Middle row: Workday (left), ServiceNow (right) -->
  <rect x="50" y="290" width="140" height="60" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="120" y="326" text-anchor="middle" font-size="16" fill="#111827">Workday</text>

  <rect x="610" y="290" width="140" height="60" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="680" y="326" text-anchor="middle" font-size="16" fill="#111827">ServiceNow</text>

  <!-- Bottom row: Jira, Outlook -->
  <rect x="80" y="470" width="140" height="60" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="150" y="506" text-anchor="middle" font-size="16" fill="#111827">Jira</text>

  <rect x="580" y="470" width="140" height="60" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="650" y="506" text-anchor="middle" font-size="16" fill="#111827">Outlook</text>

  <!-- Connection lines from services to AgentSpace center -->
  <!-- Calendar (top-left) to AgentSpace -->
  <line x1="220" y1="140" x2="300" y2="270" stroke="#374151" stroke-width="2" marker-end="url(#arrow-25_2)"/>
  <!-- Gmail (top-right) to AgentSpace -->
  <line x1="580" y1="140" x2="500" y2="270" stroke="#374151" stroke-width="2" marker-end="url(#arrow-25_2)"/>
  <!-- Workday (left) to AgentSpace -->
  <line x1="190" y1="310" x2="300" y2="300" stroke="#374151" stroke-width="2" marker-end="url(#arrow-25_2)"/>
  <!-- ServiceNow (right) to AgentSpace -->
  <line x1="610" y1="330" x2="500" y2="310" stroke="#374151" stroke-width="2" marker-end="url(#arrow-25_2)"/>
  <!-- Jira (bottom-left) to AgentSpace -->
  <line x1="220" y1="490" x2="305" y2="345" stroke="#374151" stroke-width="2" marker-end="url(#arrow-25_2)"/>
  <!-- Outlook (bottom-right) to AgentSpace -->
  <line x1="580" y1="490" x2="498" y2="345" stroke="#374151" stroke-width="2" marker-end="url(#arrow-25_2)"/>

  <!-- Labels on connection lines -->
  <text x="240" y="200" text-anchor="middle" font-size="12" fill="#6B7280">API</text>
  <text x="560" y="200" text-anchor="middle" font-size="12" fill="#6B7280">API</text>
  <text x="240" y="300" text-anchor="middle" font-size="12" fill="#6B7280">API</text>
  <text x="560" y="315" text-anchor="middle" font-size="12" fill="#6B7280">API</text>
  <text x="245" y="420" text-anchor="middle" font-size="12" fill="#6B7280">API</text>
  <text x="555" y="420" text-anchor="middle" font-size="12" fill="#6B7280">API</text>

  <!-- Bottom description -->
  <text x="400" y="575" text-anchor="middle" font-size="13" fill="#6B7280">AgentSpace 通过标准化接口集成多种企业 SaaS 服务,实现数据互通与流程自动化</text>
</svg>