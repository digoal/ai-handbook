<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <marker id="arrow-3_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="800" height="600" fill="#FFFFFF"/>

  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="bold" font-family="sans-serif, Microsoft YaHei, 微软雅黑" fill="#111827">并行化模式:多组件并发执行</text>

  <!-- Input Task -->
  <rect x="40" y="250" width="110" height="70" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="95" y="285" text-anchor="middle" font-size="15" font-weight="bold" font-family="sans-serif, Microsoft YaHei, 微软雅黑" fill="#111827">输入任务</text>
  <text x="95" y="305" text-anchor="middle" font-size="12" font-family="sans-serif, Microsoft YaHei, 微软雅黑" fill="#374151">Input Task</text>

  <!-- Parallel Branches Label -->
  <text x="400" y="100" text-anchor="middle" font-size="16" font-weight="bold" font-family="sans-serif, Microsoft YaHei, 微软雅黑" fill="#B45309">↓ 并行执行分支 ↓</text>

  <!-- Branch 1: LLM Call -->
  <rect x="210" y="160" width="160" height="65" rx="8" ry="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="290" y="190" text-anchor="middle" font-size="15" font-weight="bold" font-family="sans-serif, Microsoft YaHei, 微软雅黑" fill="#111827">LLM 调用</text>
  <text x="290" y="210" text-anchor="middle" font-size="12" font-family="sans-serif, Microsoft YaHei, 微软雅黑" fill="#374151">大语言模型推理</text>

  <!-- Branch 2: Tool Call -->
  <rect x="210" y="260" width="160" height="65" rx="8" ry="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="290" y="290" text-anchor="middle" font-size="15" font-weight="bold" font-family="sans-serif, Microsoft YaHei, 微软雅黑" fill="#111827">工具调用</text>
  <text x="290" y="310" text-anchor="middle" font-size="12" font-family="sans-serif, Microsoft YaHei, 微软雅黑" fill="#374151">Tools / API</text>

  <!-- Branch 3: Sub-Agent -->
  <rect x="210" y="360" width="160" height="65" rx="8" ry="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="290" y="390" text-anchor="middle" font-size="15" font-weight="bold" font-family="sans-serif, Microsoft YaHei, 微软雅黑" fill="#111827">子智能体</text>
  <text x="290" y="410" text-anchor="middle" font-size="12" font-family="sans-serif, Microsoft YaHei, 微软雅黑" fill="#374151">Sub-Agent</text>

  <!-- Aggregation Node -->
  <rect x="450" y="250" width="130" height="70" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="515" y="285" text-anchor="middle" font-size="15" font-weight="bold" font-family="sans-serif, Microsoft YaHei, 微软雅黑" fill="#111827">聚合</text>
  <text x="515" y="305" text-anchor="middle" font-size="12" font-family="sans-serif, Microsoft YaHei, 微软雅黑" fill="#374151">Aggregation</text>

  <!-- Output -->
  <rect x="650" y="250" width="120" height="70" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="710" y="285" text-anchor="middle" font-size="15" font-weight="bold" font-family="sans-serif, Microsoft YaHei, 微软雅黑" fill="#111827">单一输出</text>
  <text x="710" y="305" text-anchor="middle" font-size="12" font-family="sans-serif, Microsoft YaHei, 微软雅黑" fill="#374151">Final Output</text>

  <!-- Arrows from Input to three branches -->
  <line x1="150" y1="270" x2="210" y2="192" stroke="#374151" stroke-width="2" marker-end="url(#arrow-3_1)"/>
  <line x1="150" y1="285" x2="210" y2="292" stroke="#374151" stroke-width="2" marker-end="url(#arrow-3_1)"/>
  <line x1="150" y1="300" x2="210" y2="392" stroke="#374151" stroke-width="2" marker-end="url(#arrow-3_1)"/>

  <!-- Arrows from three branches to Aggregation -->
  <line x1="370" y1="192" x2="450" y2="270" stroke="#374151" stroke-width="2" marker-end="url(#arrow-3_1)"/>
  <line x1="370" y1="292" x2="450" y2="285" stroke="#374151" stroke-width="2" marker-end="url(#arrow-3_1)"/>
  <line x1="370" y1="392" x2="450" y2="300" stroke="#374151" stroke-width="2" marker-end="url(#arrow-3_1)"/>

  <!-- Arrow from Aggregation to Output -->
  <line x1="580" y1="285" x2="650" y2="285" stroke="#374151" stroke-width="2" marker-end="url(#arrow-3_1)"/>

  <!-- Serial Comparison Section -->
  <line x1="40" y1="490" x2="760" y2="490" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="400" y="515" text-anchor="middle" font-size="15" font-weight="bold" font-family="sans-serif, Microsoft YaHei, 微软雅黑" fill="#374151">与串行执行的时间对比</text>

  <!-- Serial timeline -->
  <text x="50" y="545" text-anchor="start" font-size="13" font-family="sans-serif, Microsoft YaHei, 微软雅黑" fill="#111827">串行:</text>
  <rect x="110" y="535" width="600" height="20" rx="4" ry="4" fill="#E5E7EB" stroke="#374151" stroke-width="1"/>
  <rect x="110" y="535" width="200" height="20" rx="4" ry="4" fill="#FCA5A5" stroke="#374151" stroke-width="1"/>
  <rect x="310" y="535" width="200" height="20" rx="4" ry="4" fill="#FCA5A5" stroke="#374151" stroke-width="1"/>
  <rect x="510" y="535" width="200" height="20" rx="4" ry="4" fill="#FCA5A5" stroke="#374151" stroke-width="1"/>
  <text x="210" y="550" text-anchor="middle" font-size="10" font-family="sans-serif, Microsoft YaHei, 微软雅黑" fill="#111827">LLM</text>
  <text x="410" y="550" text-anchor="middle" font-size="10" font-family="sans-serif, Microsoft YaHei, 微软雅黑" fill="#111827">Tool</text>
  <text x="610" y="550" text-anchor="middle" font-size="10" font-family="sans-serif, Microsoft YaHei, 微软雅黑" fill="#111827">Agent</text>
  <text x="720" y="550" text-anchor="end" font-size="11" font-family="sans-serif, Microsoft YaHei, 微软雅黑" fill="#374151">T = t1+t2+t3</text>

  <!-- Parallel timeline -->
  <text x="50" y="575" text-anchor="start" font-size="13" font-family="sans-serif, Microsoft YaHei, 微软雅黑" fill="#111827">并行:</text>
  <rect x="110" y="565" width="600" height="20" rx="4" ry="4" fill="#E5E7EB" stroke="#374151" stroke-width="1"/>
  <rect x="110" y="565" width="200" height="20" rx="4" ry="4" fill="#86EFAC" stroke="#B45309" stroke-width="1"/>
  <text x="210" y="580" text-anchor="middle" font-size="10" font-family="sans-serif, Microsoft YaHei, 微软雅黑" fill="#111827">LLM</text>
  <text x="210" y="595" text-anchor="middle" font-size="9" font-family="sans-serif, Microsoft YaHei, 微软雅黑" fill="#166534">/ Tool / Agent</text>
  <text x="320" y="580" text-anchor="middle" font-size="11" font-family="sans-serif, Microsoft YaHei, 微软雅黑" fill="#166534" font-weight="bold">≈ 节省 2/3 时间</text>
</svg>