<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <marker id="arrow-14_2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="800" height="600" fill="#FFFFFF"/>
  <text x="400" y="35" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="20" fill="#111827" font-weight="bold">智能体式 RAG:推理智能体优化检索</text>

  <!-- Node 1: 用户查询 -->
  <rect x="50" y="100" width="130" height="60" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="115" y="135" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="15" fill="#111827">用户查询</text>

  <!-- Node 2: 推理智能体分析 (emphasized) -->
  <rect x="230" y="100" width="150" height="60" rx="8" ry="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="305" y="135" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="15" fill="#111827">推理智能体分析</text>

  <!-- Node 3: 多轮检索决策 (emphasized) -->
  <rect x="430" y="100" width="150" height="60" rx="8" ry="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="505" y="135" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="15" fill="#111827">多轮检索决策</text>

  <!-- Node 4: 向量数据库检索 -->
  <rect x="630" y="100" width="150" height="60" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="705" y="135" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="15" fill="#111827">向量数据库检索</text>

  <!-- Node 5: 文档重排序 -->
  <rect x="630" y="220" width="150" height="60" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="705" y="255" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="15" fill="#111827">文档重排序</text>

  <!-- Node 6: 智能体评估相关性 (emphasized) -->
  <rect x="430" y="220" width="150" height="60" rx="8" ry="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="505" y="255" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="15" fill="#111827">智能体评估相关性</text>

  <!-- Node 7: 调整查询重新检索 (emphasized) -->
  <rect x="230" y="220" width="150" height="60" rx="8" ry="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="305" y="255" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="15" fill="#111827">调整查询重新检索</text>

  <!-- Node 8: 最终整合生成答案 -->
  <rect x="310" y="380" width="180" height="60" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="400" y="415" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="15" fill="#111827">最终整合生成答案</text>

  <!-- Arrows -->
  <line x1="180" y1="130" x2="225" y2="130" stroke="#374151" stroke-width="2" marker-end="url(#arrow-14_2)"/>
  <line x1="380" y1="130" x2="425" y2="130" stroke="#374151" stroke-width="2" marker-end="url(#arrow-14_2)"/>
  <line x1="580" y1="130" x2="625" y2="130" stroke="#374151" stroke-width="2" marker-end="url(#arrow-14_2)"/>
  <line x1="705" y1="160" x2="705" y2="215" stroke="#374151" stroke-width="2" marker-end="url(#arrow-14_2)"/>
  <line x1="630" y1="250" x2="585" y2="250" stroke="#374151" stroke-width="2" marker-end="url(#arrow-14_2)"/>
  <line x1="430" y1="250" x2="385" y2="250" stroke="#374151" stroke-width="2" marker-end="url(#arrow-14_2)"/>
  <text x="450" y="240" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="11" fill="#6B7280">不充分</text>

  <!-- Feedback loop from 调整查询回到 推理智能体 -->
  <path d="M 305 280 Q 305 320 250 320 Q 200 320 200 200 Q 200 130 230 130" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow-14_2)"/>

  <!-- Arrow to final answer -->
  <line x1="305" y1="280" x2="350" y2="375" stroke="#374151" stroke-width="2" marker-end="url(#arrow-14_2)"/>
  <text x="290" y="340" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="11" fill="#6B7280">充分</text>

  <!-- From 评估 to final -->
  <line x1="450" y1="410" x2="495" y2="410" stroke="#374151" stroke-width="2" marker-end="url(#arrow-14_2)"/>

  <!-- Legend -->
  <rect x="50" y="490" width="20" height="16" rx="3" ry="3" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="78" y="503" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="13" fill="#111827">标准节点</text>

  <rect x="180" y="490" width="20" height="16" rx="3" ry="3" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="208" y="503" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="13" fill="#111827">智能体决策节点</text>

  <!-- Footer note -->
  <text x="400" y="570" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="13" fill="#6B7280">智能体通过多轮推理动态决定检索策略,评估相关性后决定是否需要调整查询再次检索</text>
</svg>