<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <marker id="arrow-6_4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="600" fill="#FFFFFF"/>

  <text x="400" y="35" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="20" fill="#111827" font-weight="bold">规划(Planning)模式视觉总览</text>
  <line x1="40" y1="50" x2="760" y2="50" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Row 1: 任务分解 -->
  <rect x="50" y="90" width="160" height="90" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="130" y="120" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="16" fill="#111827" font-weight="bold">任务分解</text>
  <text x="130" y="148" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#374151">复杂目标 → 子任务</text>
  <text x="130" y="166" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#374151">逐层拆解</text>

  <!-- Row 1: 依赖分析 -->
  <rect x="270" y="90" width="160" height="90" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="350" y="120" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="16" fill="#111827" font-weight="bold">依赖分析</text>
  <text x="350" y="148" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#374151">子任务 → 关系图</text>
  <text x="350" y="166" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#374151">识别先后顺序</text>

  <!-- Row 1: 执行计划 -->
  <rect x="490" y="90" width="160" height="90" rx="8" ry="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="570" y="120" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="16" fill="#111827" font-weight="bold">执行计划</text>
  <text x="570" y="148" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#374151">有序执行序列</text>
  <text x="570" y="166" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#374151">生成行动方案</text>

  <!-- Row 1 Arrows -->
  <line x1="210" y1="135" x2="265" y2="135" stroke="#374151" stroke-width="2" marker-end="url(#arrow-6_4)"/>
  <line x1="430" y1="135" x2="485" y2="135" stroke="#374151" stroke-width="2" marker-end="url(#arrow-6_4)"/>

  <!-- Arrow from 执行计划 to monitor -->
  <path d="M 570 180 Q 570 240 350 280" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow-6_4)"/>

  <!-- Row 2: 监控与重规划 (highlighted) -->
  <rect x="250" y="280" width="200" height="90" rx="8" ry="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="350" y="310" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="16" fill="#111827" font-weight="bold">监控与重规划</text>
  <text x="350" y="338" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#374151">根据执行反馈</text>
  <text x="350" y="356" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#374151">动态调整计划</text>

  <!-- Subtask examples under 任务分解 -->
  <rect x="40" y="240" width="90" height="40" rx="8" ry="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
  <text x="85" y="265" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="13" fill="#111827">子任务 A</text>

  <rect x="40" y="290" width="90" height="40" rx="8" ry="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
  <text x="85" y="315" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="13" fill="#111827">子任务 B</text>

  <rect x="40" y="340" width="90" height="40" rx="8" ry="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
  <text x="85" y="365" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="13" fill="#111827">子任务 C</text>

  <line x1="130" y1="180" x2="85" y2="240" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow-6_4)"/>
  <line x1="130" y1="180" x2="85" y2="310" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="130" y1="180" x2="85" y2="360" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow-6_4)"/>

  <!-- Dependency diagram under 依赖分析 -->
  <circle cx="320" cy="220" r="18" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
  <text x="320" y="225" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#111827">A</text>
  <circle cx="380" cy="200" r="18" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
  <text x="380" y="205" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#111827">B</text>
  <circle cx="430" cy="240" r="18" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
  <text x="430" y="245" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#111827">C</text>

  <line x1="335" y1="212" x2="365" y2="208" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow-6_4)"/>
  <line x1="385" y1="215" x2="415" y2="232" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow-6_4)"/>
  <line x1="338" y1="232" x2="415" y2="238" stroke="#374151" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-6_4)"/>

  <!-- Execution sequence under 执行计划 -->
  <rect x="500" y="210" width="55" height="36" rx="6" ry="6" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
  <text x="527" y="232" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#111827">Step 1</text>

  <rect x="565" y="210" width="55" height="36" rx="6" ry="6" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
  <text x="592" y="232" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#111827">Step 2</text>

  <rect x="630" y="210" width="55" height="36" rx="6" ry="6" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
  <text x="657" y="232" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#111827">Step 3</text>

  <line x1="555" y1="228" x2="563" y2="228" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow-6_4)"/>
  <line x1="620" y1="228" x2="628" y2="228" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow-6_4)"/>

  <!-- Feedback loop arrow from 监控 to 执行计划 -->
  <path d="M 450 310 Q 600 360 600 195" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-6_4)"/>
  <text x="555" y="380" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#B45309" font-style="italic">反馈 / 重规划</text>

  <!-- Loop labels at top -->
  <text x="237" y="125" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="11" fill="#6B7280">拆解</text>
  <text x="457" y="125" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="11" fill="#6B7280">分析</text>

  <!-- Side annotations -->
  <text x="130" y="210" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="11" fill="#6B7280">↓ 输出</text>
  <text x="350" y="195" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="11" fill="#6B7280">↓ 关系建模</text>
  <text x="570" y="195" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="11" fill="#6B7280">↓ 排序</text>

  <!-- Bottom: Iteration cycle -->
  <rect x="100" y="430" width="600" height="120" rx="8" ry="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="400" y="455" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="14" fill="#111827" font-weight="bold">规划循环(Plan-Act-Observe-Replan)</text>

  <circle cx="180" cy="510" r="26" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="180" y="515" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#111827" font-weight="bold">Plan</text>

  <circle cx="320" cy="510" r="26" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="320" y="515" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#111827" font-weight="bold">Act</text>

  <circle cx="460" cy="510" r="26" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="460" y="515" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#111827" font-weight="bold">Observe</text>

  <circle cx="600" cy="510" r="26" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="600" y="515" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#111827" font-weight="bold">Replan</text>

  <path d="M 206 510 Q 240 510 294 510" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow-6_4)"/>
  <path d="M 346 510 Q 380 510 434 510" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow-6_4)"/>
  <path d="M 486 510 Q 520 510 574 510" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow-6_4)"/>
  <path d="M 600 484 Q 600 440 400 440 Q 200 440 180 484" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-6_4)"/>

  <text x="250" y="500" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="11" fill="#6B7280">执行</text>
  <text x="390" y="500" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="11" fill="#6B7280">观察</text>
  <text x="530" y="500" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="11" fill="#6B7280">评估</text>
  <text x="400" y="430" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="11" fill="#B45309" font-style="italic">反馈循环</text>

  <!-- Footer note -->
  <text x="400" y="580" text-anchor="middle" font-family="sans-serif, Microsoft YaHei, 微软雅黑" font-size="12" fill="#6B7280">规划模式让 Agent 能够将复杂目标拆解为可执行的步骤,并在执行过程中根据反馈持续修正</text>
</svg>