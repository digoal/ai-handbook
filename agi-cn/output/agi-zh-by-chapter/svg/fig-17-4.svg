<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="sans-serif, Microsoft YaHei, 微软雅黑">
  <defs>
    <marker id="arrow-17_4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B45309"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="600" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">多智能体系统搜索（MASS）框架</text>
  <text x="400" y="54" text-anchor="middle" font-size="13" fill="#6B7280">三阶段优化流程</text>

  <!-- 阶段一容器 -->
  <rect x="30" y="80" width="235" height="490" rx="10" ry="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="147" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">阶段一：块级提示优化</text>
  <text x="147" y="124" text-anchor="middle" font-size="11" fill="#6B7280">独立优化每个模块提示</text>

  <!-- 阶段一模块 -->
  <rect x="55" y="150" width="180" height="44" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="145" y="178" text-anchor="middle" font-size="15" fill="#111827">Aggregate 模块</text>

  <rect x="55" y="210" width="180" height="44" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="145" y="238" text-anchor="middle" font-size="15" fill="#111827">Reflect 模块</text>

  <rect x="55" y="270" width="180" height="44" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="145" y="298" text-anchor="middle" font-size="15" fill="#111827">Debate 模块</text>

  <rect x="55" y="330" width="180" height="44" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="145" y="358" text-anchor="middle" font-size="15" fill="#111827">Summarize 模块</text>

  <rect x="55" y="390" width="180" height="44" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="145" y="418" text-anchor="middle" font-size="15" fill="#111827">Tool-use 模块</text>

  <!-- 阶段一输出 -->
  <rect x="55" y="470" width="180" height="60" rx="8" ry="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="145" y="495" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">优化后的模块提示</text>
  <text x="145" y="515" text-anchor="middle" font-size="11" fill="#B45309">P₁, P₂, P₃, P₄, P₅</text>

  <!-- 阶段二容器 -->
  <rect x="290" y="80" width="220" height="490" rx="10" ry="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="400" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">阶段二：工作流拓扑优化</text>
  <text x="400" y="124" text-anchor="middle" font-size="11" fill="#6B7280">从设计空间采样有效配置</text>

  <!-- 阶段二内容：设计空间 -->
  <rect x="315" y="150" width="170" height="60" rx="8" ry="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
  <text x="400" y="175" text-anchor="middle" font-size="14" fill="#111827">设计空间</text>
  <text x="400" y="195" text-anchor="middle" font-size="11" fill="#6B7280">模块组合 + 连接关系</text>

  <!-- 候选工作流 -->
  <rect x="315" y="235" width="170" height="40" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="400" y="261" text-anchor="middle" font-size="13" fill="#111827">候选工作流 W₁</text>

  <rect x="315" y="285" width="170" height="40" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="400" y="311" text-anchor="middle" font-size="13" fill="#111827">候选工作流 W₂</text>

  <rect x="315" y="335" width="170" height="40" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="400" y="361" text-anchor="middle" font-size="13" fill="#111827">候选工作流 W₃</text>

  <text x="400" y="398" text-anchor="middle" font-size="18" fill="#6B7280">⋮</text>

  <rect x="315" y="420" width="170" height="40" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="400" y="446" text-anchor="middle" font-size="13" fill="#111827">候选工作流 Wₙ</text>

  <!-- 评估箭头 -->
  <rect x="315" y="475" width="170" height="55" rx="8" ry="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="400" y="498" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">评估 &amp; 排序</text>
  <text x="400" y="517" text-anchor="middle" font-size="11" fill="#B45309">选出最优拓扑 W*</text>

  <!-- 阶段三容器 -->
  <rect x="535" y="80" width="235" height="490" rx="10" ry="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="652" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">阶段三：工作流级提示优化</text>
  <text x="652" y="124" text-anchor="middle" font-size="11" fill="#6B7280">对最优工作流进行第二轮提示优化</text>

  <!-- 阶段三内容 -->
  <rect x="560" y="160" width="185" height="55" rx="8" ry="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="652" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">最优工作流 W*</text>
  <text x="652" y="203" text-anchor="middle" font-size="11" fill="#B45309">拓扑结构固定</text>

  <!-- 联合优化 -->
  <rect x="560" y="240" width="185" height="60" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="652" y="265" text-anchor="middle" font-size="14" fill="#111827">联合提示优化</text>
  <text x="652" y="284" text-anchor="middle" font-size="11" fill="#6B7280">端到端微调所有提示</text>

  <!-- 模块提示更新示意 -->
  <rect x="560" y="325" width="185" height="44" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="652" y="353" text-anchor="middle" font-size="13" fill="#111827">P₁' , P₂' , P₃'</text>

  <rect x="560" y="380" width="185" height="44" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="652" y="408" text-anchor="middle" font-size="13" fill="#111827">P₄' , P₅'</text>

  <!-- 最终输出 -->
  <rect x="560" y="455" width="185" height="80" rx="8" ry="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
  <text x="652" y="482" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">最终 MASS 系统</text>
  <text x="652" y="502" text-anchor="middle" font-size="11" fill="#B45309">最优拓扑 + 最优提示</text>
  <text x="652" y="520" text-anchor="middle" font-size="11" fill="#B45309">W* + P₁' ... P₅'</text>

  <!-- 连接箭头 -->
  <!-- 阶段一内部箭头：模块到优化输出 -->
  <line x1="145" y1="434" x2="145" y2="468" stroke="#374151" stroke-width="2" marker-end="url(#arrow-17_4)"/>

  <!-- 阶段一到阶段二 -->
  <line x1="235" y1="500" x2="313" y2="240" stroke="#B45309" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="260" y="360" text-anchor="middle" font-size="11" fill="#B45309" transform="rotate(-50, 260, 360)">输入模块提示</text>

  <!-- 阶段二内部箭头 -->
  <line x1="400" y1="210" x2="400" y2="233" stroke="#374151" stroke-width="2" marker-end="url(#arrow-17_4)"/>
  <line x1="400" y1="275" x2="400" y2="283" stroke="#374151" stroke-width="2" marker-end="url(#arrow-17_4)"/>
  <line x1="400" y1="325" x2="400" y2="333" stroke="#374151" stroke-width="2" marker-end="url(#arrow-17_4)"/>
  <line x1="400" y1="375" x2="400" y2="418" stroke="#374151" stroke-width="2" marker-end="url(#arrow-17_4)"/>
  <line x1="400" y1="460" x2="400" y2="473" stroke="#374151" stroke-width="2" marker-end="url(#arrow-17_4)"/>

  <!-- 阶段二到阶段三 -->
  <line x1="485" y1="502" x2="558" y2="187" stroke="#B45309" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="540" y="320" text-anchor="middle" font-size="11" fill="#B45309" transform="rotate(-55, 540, 320)">输出 W*</text>

  <!-- 阶段三内部箭头 -->
  <line x1="652" y1="215" x2="652" y2="238" stroke="#374151" stroke-width="2" marker-end="url(#arrow-17_4)"/>
  <line x1="652" y1="300" x2="652" y2="323" stroke="#374151" stroke-width="2" marker-end="url(#arrow-17_4)"/>
  <line x1="652" y1="369" x2="652" y2="378" stroke="#374151" stroke-width="2" marker-end="url(#arrow-17_4)"/>
  <line x1="652" y1="424" x2="652" y2="453" stroke="#374151" stroke-width="2" marker-end="url(#arrow-17_4)"/>

  <!-- 底部说明 -->
  <text x="400" y="588" text-anchor="middle" font-size="12" fill="#6B7280">图：MASS 框架依次完成提示优化、拓扑搜索与联合调优，最终输出最优多智能体工作流</text>
</svg>