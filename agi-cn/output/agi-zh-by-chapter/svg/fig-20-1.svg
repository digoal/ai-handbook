<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="sans-serif, Microsoft YaHei, 微软雅黑">
  <defs>
    <marker id="arrow-20_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B45309"/>
    </marker>
  </defs>
  <rect width="800" height="600" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="400" y="35" text-anchor="middle" font-size="20" fill="#111827" font-weight="bold">优先级排序设计模式</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="#6B7280">Prioritization Pattern: 多任务候选 → 评估 → 评分 → 排序 → 执行</text>

  <!-- 候选任务节点组 -->
  <rect x="40" y="110" width="130" height="320" rx="8" ry="8" fill="#F9FAFB" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="105" y="135" text-anchor="middle" font-size="14" fill="#111827" font-weight="bold">候选任务池</text>

  <rect x="55" y="155" width="100" height="40" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="105" y="172" text-anchor="middle" font-size="14" fill="#111827">任务 A</text>
  <text x="105" y="188" text-anchor="middle" font-size="11" fill="#6B7280">数据迁移</text>

  <rect x="55" y="210" width="100" height="40" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="105" y="227" text-anchor="middle" font-size="14" fill="#111827">任务 B</text>
  <text x="105" y="243" text-anchor="middle" font-size="11" fill="#6B7280">Bug 修复</text>

  <rect x="55" y="265" width="100" height="40" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="105" y="282" text-anchor="middle" font-size="14" fill="#111827">任务 C</text>
  <text x="105" y="298" text-anchor="middle" font-size="11" fill="#6B7280">新功能</text>

  <rect x="55" y="320" width="100" height="40" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="105" y="337" text-anchor="middle" font-size="14" fill="#111827">任务 D</text>
  <text x="105" y="353" text-anchor="middle" font-size="11" fill="#6B7280">性能优化</text>

  <rect x="55" y="375" width="100" height="40" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="105" y="392" text-anchor="middle" font-size="14" fill="#111827">任务 E</text>
  <text x="105" y="408" text-anchor="middle" font-size="11" fill="#6B7280">文档更新</text>

  <!-- 评估节点 -->
  <rect x="220" y="190" width="140" height="60" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="290" y="213" text-anchor="middle" font-size="14" fill="#111827" font-weight="bold">评估维度</text>
  <text x="290" y="233" text-anchor="middle" font-size="12" fill="#6B7280">紧急度 / 重要性</text>

  <!-- 评分计算(强调节点) -->
  <rect x="400" y="180" width="160" height="80" rx="8" ry="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/>
  <text x="480" y="205" text-anchor="middle" font-size="15" fill="#111827" font-weight="bold">评分计算</text>
  <text x="480" y="226" text-anchor="middle" font-size="12" fill="#6B7280">加权 / 矩阵 / MoSCoW</text>
  <text x="480" y="245" text-anchor="middle" font-size="11" fill="#B45309">Score = f(U, I, ...)</text>

  <!-- 排序 -->
  <rect x="600" y="190" width="130" height="60" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="665" y="213" text-anchor="middle" font-size="14" fill="#111827" font-weight="bold">排序</text>
  <text x="665" y="233" text-anchor="middle" font-size="12" fill="#6B7280">按评分降序</text>

  <!-- 选择执行 -->
  <rect x="600" y="310" width="130" height="60" rx="8" ry="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/>
  <text x="665" y="333" text-anchor="middle" font-size="15" fill="#111827" font-weight="bold">选择执行</text>
  <text x="665" y="353" text-anchor="middle" font-size="12" fill="#B45309">最高优先级任务</text>

  <!-- 算法分支区标题 -->
  <text x="400" y="465" text-anchor="middle" font-size="15" fill="#111827" font-weight="bold">三种主流排序算法</text>

  <!-- 加权评分 -->
  <rect x="60" y="485" width="210" height="80" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="165" y="508" text-anchor="middle" font-size="14" fill="#111827" font-weight="bold">加权评分</text>
  <text x="165" y="527" text-anchor="middle" font-size="11" fill="#374151">Score = w1·U + w2·I</text>
  <text x="165" y="544" text-anchor="middle" font-size="11" fill="#6B7280">灵活、可量化权重</text>
  <text x="165" y="559" text-anchor="middle" font-size="11" fill="#6B7280">适用:综合评分场景</text>

  <!-- Eisenhower 矩阵 -->
  <rect x="295" y="485" width="210" height="80" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="400" y="508" text-anchor="middle" font-size="14" fill="#111827" font-weight="bold">Eisenhower 矩阵</text>
  <text x="400" y="527" text-anchor="middle" font-size="11" fill="#374151">四象限分类法</text>
  <text x="400" y="544" text-anchor="middle" font-size="11" fill="#6B7280">紧急×重要 → 4 类</text>
  <text x="400" y="559" text-anchor="middle" font-size="11" fill="#6B7280">适用:时间管理决策</text>

  <!-- MoSCoW -->
  <rect x="530" y="485" width="210" height="80" rx="8" ry="8" fill="#DBEAFE" stroke="#1F2937" stroke-width="2"/>
  <text x="635" y="508" text-anchor="middle" font-size="14" fill="#111827" font-weight="bold">MoSCoW 法</text>
  <text x="635" y="527" text-anchor="middle" font-size="11" fill="#374151">Must / Should / Could / Won't</text>
  <text x="635" y="544" text-anchor="middle" font-size="11" fill="#6B7280">分级标签排序</text>
  <text x="635" y="559" text-anchor="middle" font-size="11" fill="#6B7280">适用:需求优先级</text>

  <!-- 连接箭头:候选任务 → 评估(汇总线) -->
  <line x1="155" y1="175" x2="215" y2="210" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow-20_1)"/>
  <line x1="155" y1="230" x2="215" y2="222" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow-20_1)"/>
  <line x1="155" y1="285" x2="215" y2="230" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow-20_1)"/>
  <line x1="155" y1="340" x2="215" y2="238" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow-20_1)"/>
  <line x1="155" y1="395" x2="215" y2="245" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow-20_1)"/>

  <!-- 评估 → 评分计算 -->
  <line x1="360" y1="220" x2="395" y2="220" stroke="#374151" stroke-width="2" marker-end="url(#arrow-20_1)"/>

  <!-- 评分计算 → 排序 -->
  <line x1="560" y1="220" x2="595" y2="220" stroke="#374151" stroke-width="2" marker-end="url(#arrow-20_1)"/>

  <!-- 排序 → 选择执行 -->
  <line x1="665" y1="250" x2="665" y2="305" stroke="#374151" stroke-width="2" marker-end="url(#arrow-20_1)"/>

  <!-- 评分计算 → 算法分支(三条线指向下方三算法) -->
  <path d="M 480 260 Q 480 380 165 480" fill="none" stroke="#B45309" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-orange)"/>
  <path d="M 480 260 Q 480 380 400 480" fill="none" stroke="#B45309" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-orange)"/>
  <path d="M 480 260 Q 480 380 635 480" fill="none" stroke="#B45309" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-orange)"/>

  <!-- 底部说明 -->
  <text x="400" y="588" text-anchor="middle" font-size="12" fill="#6B7280">优先级排序模式:在多任务场景下,系统化地评估、量化与排序,以选择最优执行顺序</text>
</svg>